# Example Apache configuration for the standalone nethandle service.
# Adjust ServerName and paths to match the gateway.

<VirtualHost *:443>
    ServerName gateway.example.net

    DocumentRoot /var/www/nethandle/public

    <Directory /var/www/nethandle/public>
        Require all granted
        AllowOverride None
        Options -Indexes
        DirectoryIndex index.php
    </Directory>

    SetEnv NETHANDLE_API_TOKEN "replace-with-a-long-random-token"
    SetEnv NETHANDLE_BIN "/usr/local/bin/nethandle"
    SetEnv NETHANDLE_SUDO_BIN "/usr/bin/sudo"
    SetEnv NETHANDLE_TIMEOUT_BIN "/usr/bin/timeout"
    SetEnv NETHANDLE_TIMEOUT_SECONDS "10"
    SetEnv NETHANDLE_AUDIT_LOG "/var/log/nethandle-api/audit.log"

    # TLS configuration belongs here or in the gateway's existing SSL setup.
</VirtualHost>
